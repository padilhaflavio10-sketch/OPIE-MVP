name: Validate MVP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build frontend for Tauri context
        run: |
          npm ci
          npm run build
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build Windows application
        run: npm run tauri build
      - name: Smoke test Windows application
        shell: powershell
        run: |
          $executable = Join-Path $PWD 'src-tauri\target\release\opie-mvp.exe'
          $appProcess = Start-Process -FilePath $executable -PassThru
          try {
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 1
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "A aplicação encerrou antes de criar a janela principal."
              }
              if ($appProcess.MainWindowHandle -ne 0) {
                break
              }
            }
            if ($appProcess.MainWindowHandle -eq 0) {
              throw "A janela principal não foi criada no prazo esperado."
            }
            if ($appProcess.MainWindowTitle -ne 'OPIE MVP') {
              throw "Título inesperado: $($appProcess.MainWindowTitle)"
            }
          } finally {
            if (-not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id
            }
          }
      - name: Preserve Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opie-mvp-windows
          path: |
            src-tauri/target/release/opie-mvp.exe
            src-tauri/target/release/bundle/**/*
