name: Validate MVP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'
  NPM_VERSION: '11.16.0'
  RUST_VERSION: '1.88.0'

jobs:
  lockfile-bootstrap:
    name: Temporary lockfile bootstrap
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pin npm
        shell: powershell
        run: npm install --global "npm@$env:NPM_VERSION"
      - name: Generate exact dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-lock-002-c
          if-no-files-found: error
          path: package-lock.json

  frontend:
    name: Frontend build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pin and verify Node.js and npm
        shell: powershell
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          $nodeVersion = node --version
          $npmVersion = npm --version
          if ($nodeVersion -ne "v$env:NODE_VERSION") {
            throw "Node.js inesperado: $nodeVersion"
          }
          if ($npmVersion -ne $env:NPM_VERSION) {
            throw "npm inesperado: $npmVersion"
          }
      - name: Install dependencies
        run: npm ci
      - name: Test frontend model
        run: npm run test:model
      - name: Test React components
        run: npm run test:component
      - name: Verify synchronized application versions
        shell: powershell
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $packageLock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoLock = Get-Content src-tauri/Cargo.lock -Raw
          $cargoTomlVersion = [regex]::Match(
            $cargoToml,
            '(?m)^version = "([^"]+)"'
          ).Groups[1].Value
          $cargoLockVersion = [regex]::Match(
            $cargoLock,
            '(?ms)\[\[package\]\]\s+name = "opie-mvp"\s+version = "([^"]+)"'
          ).Groups[1].Value
          $versions = @(
            $package.version,
            $packageLock.version,
            $packageLock.packages.''.version,
            $tauri.version,
            $cargoTomlVersion,
            $cargoLockVersion
          )
          if ($versions -contains '') {
            throw "Uma ou mais versões não puderam ser lidas."
          }
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "Versões divergentes: $($versions -join ', ')"
          }
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pin and verify Node.js and npm
        shell: powershell
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          $nodeVersion = node --version
          $npmVersion = npm --version
          if ($nodeVersion -ne "v$env:NODE_VERSION") {
            throw "Node.js inesperado: $nodeVersion"
          }
          if ($npmVersion -ne $env:NPM_VERSION) {
            throw "npm inesperado: $npmVersion"
          }
      - name: Build frontend for Tauri context
        run: |
          npm ci
          npm run test:model
          npm run test:component
          npm run build
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # commit 2026-07-16; Rust 1.88.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Verify Rust toolchain
        shell: powershell
        run: |
          $rustcVersion = rustc --version
          $cargoVersion = cargo --version
          if (-not $rustcVersion.StartsWith("rustc $env:RUST_VERSION ")) {
            throw "rustc inesperado: $rustcVersion"
          }
          if (-not $cargoVersion.StartsWith("cargo $env:RUST_VERSION ")) {
            throw "cargo inesperado: $cargoVersion"
          }
      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # changelog 2.9.1, commit de 2026-03-12
        with:
          workspaces: src-tauri
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked
      - name: Guard known rejected signatures and Tauri surface
        shell: powershell
        run: |
          # Este guard detecta assinaturas conhecidas; não constitui prova semântica completa.
          $forbidden = @(
            'confirm_health_check_e2e',
            'OPIE_E2E_HEALTH_MARKER',
            'fs::write',
            'app.exit('
          )
          $productionFiles = Get-ChildItem src, src-tauri/src -Recurse -File
          foreach ($term in $forbidden) {
            $matches = $productionFiles | Select-String -SimpleMatch $term
            if ($matches) {
              throw "Termo proibido encontrado no código de produção: $term"
            }
          }
          $mainSource = Get-Content src-tauri/src/main.rs -Raw
          $handler = [regex]::Match(
            $mainSource,
            'generate_handler!\[([^\]]*)\]'
          ).Groups[1].Value -replace '\s', ''
          if ($handler -ne 'health_check') {
            throw "Superfície Tauri inesperada no handler: $handler"
          }
          $capabilities = @(Get-ChildItem src-tauri/capabilities -File -Filter '*.json')
          if ($capabilities.Count -ne 1 -or $capabilities[0].Name -ne 'default.json') {
            throw "Arquivos de capability inesperados."
          }
          if (Select-String -Path src-tauri/Cargo.toml -Pattern 'tauri-plugin-') {
            throw "Plugin Tauri não autorizado encontrado."
          }

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pin and verify Node.js and npm
        shell: powershell
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          $nodeVersion = node --version
          $npmVersion = npm --version
          if ($nodeVersion -ne "v$env:NODE_VERSION") {
            throw "Node.js inesperado: $nodeVersion"
          }
          if ($npmVersion -ne $env:NPM_VERSION) {
            throw "npm inesperado: $npmVersion"
          }
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # commit 2026-07-16; Rust 1.88.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Verify Rust toolchain
        shell: powershell
        run: |
          $rustcVersion = rustc --version
          $cargoVersion = cargo --version
          if (-not $rustcVersion.StartsWith("rustc $env:RUST_VERSION ")) {
            throw "rustc inesperado: $rustcVersion"
          }
          if (-not $cargoVersion.StartsWith("cargo $env:RUST_VERSION ")) {
            throw "cargo inesperado: $cargoVersion"
          }
      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # changelog 2.9.1, commit de 2026-03-12
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build Windows application
        run: npm run tauri build
      - name: Smoke test Windows application
        shell: powershell
        run: |
          $executable = Join-Path $PWD 'src-tauri\target\release\opie-mvp.exe'
          $appProcess = Start-Process -FilePath $executable -PassThru
          try {
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 1
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "A aplicação encerrou antes de criar a janela principal."
              }
              if ($appProcess.MainWindowHandle -ne 0) {
                break
              }
            }
            if ($appProcess.MainWindowHandle -eq 0) {
              throw "A janela principal não foi criada no prazo esperado."
            }
            if ($appProcess.MainWindowTitle -ne 'OPIE MVP') {
              throw "Título inesperado: $($appProcess.MainWindowTitle)"
            }

            if (-not $appProcess.CloseMainWindow()) {
              throw "A janela principal rejeitou a solicitação de fechamento normal."
            }
            if (-not $appProcess.WaitForExit(15000)) {
              throw "A aplicação não encerrou normalmente no prazo esperado."
            }
          } finally {
            if (-not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id
            }
          }
      - name: Verify Windows artifacts individually
        shell: powershell
        run: |
          $exe = 'src-tauri/target/release/opie-mvp.exe'
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File)
          $nsis = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File)
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "EXE esperado não encontrado: $exe"
          }
          if ($msi.Count -lt 1) {
            throw "Nenhum MSI foi encontrado."
          }
          if ($nsis.Count -lt 1) {
            throw "Nenhum instalador NSIS foi encontrado."
          }
      - name: Preserve Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opie-mvp-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/opie-mvp.exe
            src-tauri/target/release/bundle/**/*
