name: Validate MVP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build Windows application
        run: npm run tauri build
      - name: Preserve Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opie-mvp-windows
          path: |
            src-tauri/target/release/opie-mvp.exe
            src-tauri/target/release/bundle/**/*
